name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aihappey-unified
    steps:
      - uses: actions/checkout@v4
        with:
          path: aihappey-unified
      - uses: actions/checkout@v4
        with:
          repository: achappey/aihappey-responses
          path: aihappey-responses
      - uses: actions/checkout@v4
        with:
          repository: achappey/aihappey-chatcompletions
          path: aihappey-chatcompletions
      - uses: actions/checkout@v4
        with:
          repository: achappey/aihappey-messages
          path: aihappey-messages
      - uses: actions/checkout@v4
        with:
          repository: achappey/aihappey-interactions
          path: aihappey-interactions
      - uses: actions/checkout@v4
        with:
          repository: achappey/aihappey-vercel
          path: aihappey-vercel
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview
      - name: Standalone public-API, mapping, and isolation tests
        run: dotnet test AIHappey.Unified.slnx -c Release
      - name: Verify isolated package consumption
        shell: pwsh
        run: ./tests/Verify-PackageConsumption.ps1
